name: Test

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v1

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Lint (flake8)
        run: .venv/bin/python -m flake8 .

      - name: Install Dify Plugin CLI (linux amd64)
        run: |
          curl -fsSL --retry 3 --retry-delay 5 -o /tmp/dify \
            https://github.com/langgenius/dify-plugin-daemon/releases/latest/download/dify-plugin-linux-amd64
          sudo install -m 0755 /tmp/dify /usr/local/bin/dify
          dify version

      - name: Validate packaging
        run: dify plugin package . -o apify.difypkg
