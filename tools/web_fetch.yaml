identity:
  name: web_fetch
  author: 'Apify'
  label:
    en_US: Web Fetch
description:
  human:
    en_US: Fetch a single URL and get its content as markdown, HTML, text, links, or raw, in exactly the formats you request, from a single API call.
  llm: |
    This tool fetches a single web page, PDF, or other file using the Web Fetch Actor and returns its content
    in one call, with anti-bot handling included. It requires a `url`. Use `formats` to choose which content
    representations to return (omit it to let Web Fetch choose by content type: markdown for HTML and PDF, text for
    textual data, and raw for binary files such as images), and `headers` to send custom HTTP headers to the target
    site. The result contains the requested URL, `fetch` details (including the target's `httpStatusCode`), page
    `metadata` (title, description, language, and more), and one key per requested format.
    Always check `fetch.httpStatusCode`, because an error page such as a 404 is still returned successfully.
    A requested format that does not apply to the content type (e.g. `html` for a JSON file) is returned as null;
    the call fails only if none of them apply.
parameters:
  - name: url
    type: string
    required: true
    form: llm
    label:
      en_US: URL
    human_description:
      en_US: URL to be fetched. Must start with http:// or https:// and be a valid URL.
    llm_description: >-
      The complete URL of the web page, PDF, or file to fetch, including the http:// or https:// scheme
      (e.g. https://docs.apify.com). Only http and https are supported.
  - name: formats
    type: string
    required: false
    form: llm
    label:
      en_US: Formats
    human_description:
      en_US: >-
        Comma-separated list of content formats to return: markdown, html, text, links, raw (e.g. "markdown,links").
        Only the listed formats are returned. Markdown is recommended for AI agents and LLMs. Leave empty to let
        Web Fetch choose a format based on the content type.
    llm_description: >-
      Comma-separated list of formats to return, from: markdown (clean markdown, best for reading and summarizing),
      text (plain text with no formatting), html (the page HTML, for programmatic processing), links (deduplicated
      absolute URLs found on the page, useful for deciding what to fetch next), raw (the original response body,
      base64-encoded for binary content such as images). Request only what you need, e.g. "markdown" or
      "markdown,links". Omit it to let Web Fetch choose by content type: markdown for HTML and PDF, text for textual
      data, and raw for binary files such as images.
  - name: headers
    type: string
    required: false
    form: llm
    label:
      en_US: Headers
    human_description:
      en_US: >-
        Optional custom HTTP headers to send to the target URL, as a JSON object of header names and values,
        e.g. {"Accept-Language": "fr-FR"}. Leave empty to send none.
    llm_description: >-
      Optional JSON object of extra HTTP headers to send to the target URL, e.g. {"Accept-Language": "fr-FR"} to get
      a localized page or {"Authorization": "Bearer <token>"} for a page that needs it. Omit it unless the page needs
      specific headers.
output_schema:
  properties:
    result:
      type: object
      description: The Web Fetch response for the URL.
      properties:
        url:
          type: string
          description: The requested URL.
        fetch:
          type: object
          description: Details of the HTTP fetch of the target URL.
          properties:
            loadedUrl:
              type: string
              description: The URL that was finally loaded, after redirects.
            loadedTime:
              type: string
              description: When the URL was loaded (ISO 8601).
            httpStatusCode:
              type: integer
              description: HTTP status code returned by the target URL (e.g. 200 or 404).
            contentLengthBytes:
              type: integer
              description: Size of the target's response body in bytes.
            contentType:
              type: string
              description: Content type of the target's response (e.g. text/html; charset=utf-8).
        metadata:
          type: object
          description: Metadata extracted from the page.
          properties:
            canonicalUrl:
              type: string
              description: Canonical URL of the page.
            title:
              type: string
              description: Page title.
            description:
              type: string
              description: Page description, or null if the page has none.
            author:
              type: string
              description: Page author, or null if the page has none.
            keywords:
              type: string
              description: Page keywords, or null if the page has none.
            languageCode:
              type: string
              description: Language code of the page (e.g. en).
            openGraph:
              type: array
              description: Open Graph tags as {property, content} objects. Omitted when the page has none.
              items:
                type: object
            jsonLd:
              type: array
              description: JSON-LD structured data found on the page, or null if there is none.
              items:
                type: object
            headers:
              type: object
              description: Response headers returned by the target URL.
        markdown:
          type: string
          description: The content as markdown. Present only if requested; null if it does not apply to the content type.
        html:
          type: string
          description: The content as HTML. Present only if requested; null if it does not apply to the content type.
        text:
          type: string
          description: The content as plain text. Present only if requested; null if it does not apply to the content type.
        links:
          type: array
          description: Deduplicated absolute URLs found on the page. Present only if requested; empty for PDFs.
          items:
            type: string
        raw:
          type: string
          description: The original response body, base64-encoded for binary content. Present only if requested.
extra:
  python:
    source: tools/web_fetch.py
