identity:
  name: scrape_single_url
  author: 'Apify'
  label:
    en_US: (Deprecated) Scrape Single URL
description:
  human:
    en_US: This operation is deprecated and will be removed in a future release. Use the Web Fetch operation instead.
  llm: |
    Deprecated: use the web_fetch tool instead. This tool scrapes a single web page using the Website Content Crawler Actor. It requires a URL and a `crawler_type`. It waits for the scrape to complete and returns the scraped page with its URL, text, markdown, HTML, and metadata.
parameters:
  - name: url
    type: string
    required: true
    form: llm
    label:
      en_US: URL to scrape
    human_description:
      en_US: URL to be scraped. Must start with http:// or https:// and be a valid URL.
    llm_description: The complete and valid URL of the web page to be scraped.
  - name: crawler_type
    type: select
    required: true
    form: llm
    label:
      en_US: Crawler type
    human_description:
      en_US: The crawling engine to use for the scrape.
    llm_description: The type of crawler to use. Adaptive is a good default.
    default: playwright:adaptive
    options:
      - value: playwright:adaptive
        label:
          en_US: Adaptive
      - value: playwright:firefox
        label:
          en_US: Firefox (Headless Browser)
      - value: cheerio
        label:
          en_US: Cheerio (Raw HTTP)
output_schema:
  properties:
    result:
      type: object
      description: The scraped content from the URL.
      properties:
        url:
          type: string
          description: The URL that was scraped.
        crawl:
          type: object
          description: Crawl information.
        text:
          type: string
          description: The extracted text content from the page.
        markdown:
          type: string
          description: The page content converted to markdown format.
        html:
          type: string
          description: The raw HTML content of the page (if saveHtml was enabled).
        screenshotUrl:
          type: string
          description: URL to the screenshot of the page (if saveScreenshots was enabled).
        metadata:
          type: object
          description: Additional metadata about the scraped page.
extra:
  python:
    source: tools/scrape_single_url.py
